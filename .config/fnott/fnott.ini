output=DP-2
layer=overlay
default-timeout=3
idle-timeout=30

min-width=300
max-width=512
max-height=512
anchor=top-right

edge-margin-vertical=18
edge-margin-horizontal=18
notification-margin=10

selection-helper=wmenu
selection-helper-uses-null-separator=yes

max-icon-size=48
background=285577ff
border-radius=0
border-size=2
border-color=285577ff
padding-vertical=12
padding-horizontal=12
title-font=monospace:size=13
title-color=ffffffff
title-format=
summary-font=monospace:size=13
summary-color=ffffffff
summary-format=<b>%s%A</b>
body-font=monospace:size=13
body-color=ffffffff
body-format=%b
progress-color=ffffffff
progress-style=background

[critical]
border-color=900000ff
